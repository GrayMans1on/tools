name: Suspend GitHub Pages
on:
  push:
    branches: [main]
    paths: [.github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Prepare unavailable page
        run: |
          mkdir _site
          touch _site/.nojekyll
          printf '%s\n' '<!doctype html><html lang="ru"><meta charset="utf-8"><title>Сайт отключён</title><h1>Сайт временно отключён</h1></html>' > _site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
